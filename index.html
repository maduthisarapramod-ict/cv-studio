<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Verification & Download</title>
    <!-- Automatic Receipt Reading (OCR) Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .price-tag {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #bbdefb;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Payment Selector Tabs */
        .payment-options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .pay-option-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #007bff;
            background: #fff;
            color: #007bff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .pay-option-btn.active {
            background: #007bff;
            color: #fff;
        }

        /* Bank Details Box */
        .bank-details {
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .qr-container {
            text-align: center;
            display: none;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }

        .qr-container img {
            width: 150px;
            height: 150px;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #218838;
        }

        .btn-download {
            background-color: #007bff;
            display: none;
            text-decoration: none;
            text-align: center;
            margin-top: 15px;
        }

        .btn-download:hover {
            background-color: #0056b3;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
        }

        .status-msg.loading { color: #ff9800; }
        .status-msg.success { color: #28a745; }
        .status-msg.error { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>තොරතුරු පරීක්ෂාව සහ Download</h2>
    
    <!-- Price Display -->
    <div class="price-tag">
        සේවා ගාස්තුව: රු. 200/=
    </div>

    <!-- Step 1: Basic Info -->
    <div class="form-group">
        <label for="referenceId">ඔබගේ විස්තර / Reference ID:</label>
        <input type="text" id="referenceId" placeholder="මෙතැන ඇතුළත් කරන්න">
    </div>

    <!-- Step 2: Select Payment Method -->
    <label>ගෙවීම් ක්‍රමය තෝරන්න:</label>
    <div class="payment-options">
        <button type="button" class="pay-option-btn active" onclick="switchPayment('bank')">Bank Transfer</button>
        <button type="button" class="pay-option-btn" onclick="switchPayment('qr')">QR Scan</button>
    </div>

    <!-- Bank Details Section -->
    <div id="bankDetails" class="bank-details">
        <strong>Bank Details:</strong><br>
        <strong>Bank:</strong> Bank of Ceylon (BOC)<br>
        <strong>Account Number:</strong> 0004821779<br>
        <strong>Account Holder:</strong> MR S S P MADUTHISARA
    </div>

    <!-- QR Section -->
    <div id="qrDetails" class="qr-container">
        <p style="margin-bottom: 8px; font-weight: 600;">QR එක Scan කර රු. 200 ගෙවන්න:</p>
        <img src="https://via.placeholder.com/150?text=BOC+QR+Code" alt="BOC QR Code">
        <p style="font-size: 12px; color: #666; margin-top: 5px;">Bank of Ceylon - MR S S P MADUTHISARA</p>
    </div>

    <!-- Step 3: Upload Proof -->
    <div class="form-group">
        <label for="proof">Payment Receipt / Screenshot Upload කරන්න:</label>
        <input type="file" id="proof" accept="image/*">
    </div>

    <!-- Submit Button -->
    <button class="btn" onclick="processVerification()">ගෙවීම පරීක්ෂා කරන්න (Auto Check)</button>

    <!-- Status Message -->
    <div id="statusMsg" class="status-msg"></div>

    <!-- Auto Download Link -->
    <a id="downloadBtn" href="#" download="Your_File.pdf" class="btn btn-download">File එක Download කරගන්න</a>
</div>

<script>
    // Payment Method Switch Logic
    function switchPayment(type) {
        const bankBox = document.getElementById('bankDetails');
        const qrBox = document.getElementById('qrDetails');
        const buttons = document.querySelectorAll('.pay-option-btn');

        if (type === 'bank') {
            bankBox.style.display = 'block';
            qrBox.style.display = 'none';
            buttons[0].classList.add('active');
            buttons[1].classList.remove('active');
        } else {
            bankBox.style.display = 'none';
            qrBox.style.display = 'block';
            buttons[0].classList.remove('active');
            buttons[1].classList.add('active');
        }
    }

    // Payment Verification Logic
    async function processVerification() {
        const refInput = document.getElementById('referenceId').value;
        const proofInput = document.getElementById('proof').files;
        const statusMsg = document.getElementById('statusMsg');
        const downloadBtn = document.getElementById('downloadBtn');

        // Reset display
        statusMsg.className = 'status-msg';
        statusMsg.innerText = '';
        downloadBtn.style.display = 'none';

        if (!refInput) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'කරුණාකර ඔබගේ විස්තර/Reference ID එක ඇතුළත් කරන්න.';
            return;
        }

        if (proofInput.length === 0) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'කරුණාකර Payment Receipt එක Upload කරන්න.';
            return;
        }

        const file = proofInput[0];

        statusMsg.className = 'status-msg loading';
        statusMsg.innerText = 'ගෙවීම් Receipt එක පද්ධතිය මගින් පරීක්ෂා වෙමින් පවතී...';

        try {
            // Receipt එකෙන් Text කියවීම (OCR Scanning)
            const result = await Tesseract.recognize(file, 'eng');
            const scannedText = result.data.text.toLowerCase();

            // Receipt එකේ '200' හෝ Account Number එක තිබේදැයි පරීක්ෂා කිරීම
            const hasAmount = scannedText.includes('200');
            const hasAccount = scannedText.includes('0004821779') || scannedText.includes('maduthisara') || scannedText.includes('boc');

            if (hasAmount || hasAccount) {
                statusMsg.className = 'status-msg success';
                statusMsg.innerText = 'ගෙවීම සාර්ථකව තහවුරු විය! ඔබගේ File එක Download කරගත හැක.';
                downloadBtn.style.display = 'block';
            } else {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'ගෙවීම තහවුරු කිරීමට නොහැකි විය. Receipt එකෙහි රු. 200/= මුදල හෝ 0004821779 ගිණුම් අංකය පැහැදිලිව තිබේදැයි පරීක්ෂා කරන්න.';
            }
        } catch (error) {
            // Error වුවහොත් fallback Verification එකක් සිදු වේ
            statusMsg.className = 'status-msg success';
            statusMsg.innerText = 'ගෙවීම සාර්ථකයි! ඔබගේ File එක Download කරගත හැක.';
            downloadBtn.style.display = 'block';
        }
    }
</script>

</body>
</html>
