<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CV Studio - Dynamic Resume Builder</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-light: rgba(2, 132, 199, 0.12);
            --sidebar-bg: #0f172a;
            --sidebar-text: #f8fafc;
            --main-bg: #ffffff;
            --card-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --photo-radius: 50%;
            --sidebar-clip: none;
            --arch-radius: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #090d16; color: #f3f4f6; height: 100vh; overflow: hidden; }

        .app-container { display: flex; height: 100vh; }

        /* Navigation / Control Sidebar */
        .dashboard {
            width: 450px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .dashboard-header {
            padding: 16px 20px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header h2 { font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .btn-admin-login { background: #374151; color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-admin-login:hover { background: #38bdf8; color: #0f172a; }

        .dashboard-body { padding: 20px; overflow-y: auto; flex: 1; }

        .form-section-divider {
            font-size: 11px;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        .form-control {
            width: 100%;
            padding: 9px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        .form-control:focus { border-color: #38bdf8; }
        textarea.form-control { resize: vertical; min-height: 60px; }

        .color-picker-wrapper { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
        .color-preset { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #ffffff33; transition: transform 0.2s; }
        .color-preset:hover { transform: scale(1.2); }

        .photo-upload-btn {
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .photo-upload-btn:hover { background: rgba(56, 189, 248, 0.15); }

        .btn-ai {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white; border: none; padding: 10px; border-radius: 6px;
            font-weight: 700; font-size: 12px; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px;
            transition: opacity 0.2s;
        }
        .btn-ai:hover { opacity: 0.9; }

        .sidebar-widget {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
        }
        .sidebar-widget h4 { font-size: 11px; color: #38bdf8; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .sidebar-widget p { font-size: 10px; color: #9ca3af; line-height: 1.4; }
        .ats-progress-bar { height: 6px; background: #1f2937; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .ats-progress-fill { height: 100%; width: 85%; background: linear-gradient(90deg, #10b981, #38bdf8); }

        .action-bar { padding: 15px; background: #1f2937; border-top: 1px solid #374151; display: flex; gap: 10px; }
        .btn-pdf { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-jpg { background: #f59e0b; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-pdf:hover { background: #059669; }
        .btn-jpg:hover { background: #d97706; }

        /* Preview Canvas Area */
        .preview-area { 
            flex: 1; 
            background: #030712; 
            overflow-y: auto; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .cv-paper {
            width: 794px;
            min-height: 1123px;
            height: auto;
            background: var(--main-bg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 260px 1fr;
            color: var(--text-main);
            position: relative;
            transition: background 0.3s ease;
            margin-bottom: 30px;
        }

        .cv-paper, .cv-paper * {
            letter-spacing: 0px !important;
            word-spacing: normal !important;
            text-rendering: optimizeLegibility !important;
            -webkit-font-smoothing: antialiased !important;
        }

        /* Sidebar Styling */
        .cv-sidebar { 
            background: var(--sidebar-bg); 
            color: var(--sidebar-text); 
            padding: 30px 20px; 
            clip-path: var(--sidebar-clip);
            border-radius: var(--arch-radius);
        }
        
        .cv-photo-frame { text-align: center; margin-bottom: 20px; position: relative; display: flex; justify-content: center; align-items: center; }
        .cv-photo-wrapper {
            width: 130px;
            height: 130px;
            border-radius: var(--photo-radius);
            border: 4px solid var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2937;
            flex-shrink: 0;
        }
        .cv-photo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: center; 
            display: block; 
        }

        .cv-side-block { margin-bottom: 20px; }
        .cv-side-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 4px; margin-bottom: 10px; line-height: 1.4 !important; }
        .cv-contact-item { background: rgba(255,255,255,0.06); padding: 8px; border-radius: 5px; font-size: 11px; margin-bottom: 6px; word-break: break-all; line-height: 1.4 !important; }

        /* Main Section Layout */
        .cv-main { 
            padding: 35px; 
            background: var(--main-bg); 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
            gap: 14px;
        }

        .cv-header-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); margin-bottom: 5px; }
        .cv-header-card h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1.3 !important; }
        .cv-header-card h2 { font-size: 13px; font-weight: 700; color: var(--primary); margin-top: 4px; text-transform: uppercase; line-height: 1.4 !important; }

        .cv-section { margin-bottom: 0px; }
        .cv-sec-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; line-height: 1.4 !important; }
        .cv-sec-title::after { content: ''; flex: 1; height: 2px; background: var(--border-color); }

        .cv-card { background: var(--card-bg); padding: 12px 15px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; position: relative; }
        .cv-card-title { font-weight: 700; font-size: 13px; line-height: 1.4 !important; }
        .cv-card-badge { font-size: 10px; font-weight: 700; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 10px; float: right; }
        .cv-card-sub { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 5px; line-height: 1.4 !important; }
        .cv-card-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5 !important; white-space: pre-line; }

        .timeline-card { border-left: 2px solid var(--primary); padding-left: 15px; border-radius: 0; border-top: none; border-right: none; border-bottom: none; background: transparent; }

        /* Payment QR Display Container */
        .qr-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin: 12px 0;
            border: 2px solid #38bdf8;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Payment Slip Upload Box */
        .upload-slip-box {
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .upload-slip-box:hover { background: rgba(56, 189, 248, 0.18); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #1f2937; border: 1px solid #374151; padding: 25px; border-radius: 12px; width: 440px; color: white; max-height: 85vh; overflow-y: auto; }
        .modal-card h3 { color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .modal-card p { font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
        .modal-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; border-radius: 6px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
        .modal-btn-close { background: #374151; color: #ffffff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 6px; }

        .is-hidden { display: none !important; }

        @media (max-width: 1024px) {
            body { height: auto; overflow-x: hidden; overflow-y: auto; }
            .app-container { flex-direction: column; height: auto; }
            .dashboard { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #1f2937; }
            .preview-area { width: 100%; padding: 15px 10px; overflow-x: hidden; min-height: auto; }
            .cv-paper { width: 100% !important; grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">

                        <div class="color-preset" style="background:#8b5cf6;" onclick="applyCustomColor('#8b5cf6')"></div>
                        <div class="color-preset" style="background:#ec4899;" onclick="applyCustomColor('#ec4899')"></div>
                    </div>
                </div>

                <!-- Profile Photo Upload -->
                <div class="form-section-divider"><i class="fa-solid fa-image"></i> Photo Upload</div>

                <div class="form-group">

                    <input type="text" id="inTitle" class="form-control" value="Senior Software Engineer" oninput="liveUpdate()">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="inEmail" class="form-control" value="saman.perera@email.com" oninput="liveUpdate()">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="inPhone" class="form-control" value="+94 77 123 4567" oninput="liveUpdate()">
                </div>
                <div class="form-group">
                    <label>Location / Address</label>
                    <input type="text" id="inAddress" class="form-control" value="Colombo, Sri Lanka" oninput="liveUpdate()">
                </div>

                <!-- Professional Summary -->
                <div class="form-section-divider"><i class="fa-solid fa-file-lines"></i> About Me / Summary</div>

                    <textarea id="inSummary" class="form-control" oninput="liveUpdate()">Experienced Software Engineer with 5+ years of background in full-stack web application development, cloud solutions, and team leadership.</textarea>
                </div>

                <!-- Work Experience -->
                <div class="form-section-divider"><i class="fa-solid fa-briefcase"></i> Experience</div>

                    <label>Role & Company</label>
                    <input type="text" id="inExpTitle" class="form-control" value="Lead Developer - TechSys Lanka" oninput="liveUpdate()">
                </div>
                <div class="form-group">
                    <label>Duration / Period</label>
                    <input type="text" id="inExpPeriod" class="form-control" value="2021 - Present" oninput="liveUpdate()">

                <div class="form-group">
                    <label>Key Responsibilities</label>
                    <textarea id="inExpDesc" class="form-control" oninput="liveUpdate()">• Architected scalable web services serving 100k+ monthly active users.
• Led a cross-functional development team of 6 engineers.</textarea>

                <!-- Skills -->

                <div class="form-group">
                    <textarea id="inSkills" class="form-control" oninput="liveUpdate()">JavaScript, React, Node.js, Python, SQL, Cloud Architecture, Git, Docker</textarea>
                </div>
