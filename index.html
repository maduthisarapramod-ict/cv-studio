<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CV Studio - Dynamic Resume Builder</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-light: rgba(2, 132, 199, 0.12);
            --sidebar-bg: #0f172a;
            --sidebar-text: #f8fafc;
            --main-bg: #ffffff;
            --card-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --photo-radius: 50%;
            --sidebar-clip: none;
            --arch-radius: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #090d16; color: #f3f4f6; height: 100vh; overflow: hidden; }

        .app-container { display: flex; height: 100vh; }

        /* Navigation / Control Sidebar */
        .dashboard {
            width: 450px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .dashboard-header {
            padding: 16px 20px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header h2 { font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .btn-admin-login { background: #374151; color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-admin-login:hover { background: #38bdf8; color: #0f172a; }

        .dashboard-body { padding: 20px; overflow-y: auto; flex: 1; }

        .form-section-divider {
            font-size: 11px;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        .form-control {
            width: 100%;
            padding: 9px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        .form-control:focus { border-color: #38bdf8; }
        textarea.form-control { resize: vertical; min-height: 60px; }

        .color-picker-wrapper { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
        .color-preset { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #ffffff33; transition: transform 0.2s; }
        .color-preset:hover { transform: scale(1.2); }

        .photo-upload-btn {
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .photo-upload-btn:hover { background: rgba(56, 189, 248, 0.15); }

        .btn-ai {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white; border: none; padding: 10px; border-radius: 6px;
            font-weight: 700; font-size: 12px; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px;
            transition: opacity 0.2s;
        }
        .btn-ai:hover { opacity: 0.9; }

        .sidebar-widget {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
        }
        .sidebar-widget h4 { font-size: 11px; color: #38bdf8; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .sidebar-widget p { font-size: 10px; color: #9ca3af; line-height: 1.4; }
        .ats-progress-bar { height: 6px; background: #1f2937; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .ats-progress-fill { height: 100%; width: 85%; background: linear-gradient(90deg, #10b981, #38bdf8); }

        .action-bar { padding: 15px; background: #1f2937; border-top: 1px solid #374151; display: flex; gap: 10px; }
        .btn-pdf { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-jpg { background: #f59e0b; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-pdf:hover { background: #059669; }
        .btn-jpg:hover { background: #d97706; }

        /* Preview Canvas Area */
        .preview-area { 
            flex: 1; 
            background: #030712; 
            overflow-y: auto; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .cv-paper {
            width: 794px;
            min-height: 1123px;
            height: auto;
            background: var(--main-bg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 260px 1fr;
            color: var(--text-main);
            position: relative;
            transition: background 0.3s ease;
            margin-bottom: 30px;
        }

        .cv-paper, .cv-paper * {
            letter-spacing: 0px !important;
            word-spacing: normal !important;
            text-rendering: optimizeLegibility !important;
            -webkit-font-smoothing: antialiased !important;
        }

        /* Sidebar Styling */
        .cv-sidebar { 
            background: var(--sidebar-bg); 
            color: var(--sidebar-text); 
            padding: 30px 20px; 
            clip-path: var(--sidebar-clip);
            border-radius: var(--arch-radius);
        }
        
        .cv-photo-frame { text-align: center; margin-bottom: 20px; position: relative; display: flex; justify-content: center; align-items: center; }
        .cv-photo-wrapper {
            width: 130px;
            height: 130px;
            border-radius: var(--photo-radius);
            border: 4px solid var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2937;
            flex-shrink: 0;
        }

        .cv-side-block { margin-bottom: 20px; }
        .cv-side-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 4px; margin-bottom: 10px; line-height: 1.4 !important; }
        .cv-contact-item { background: rgba(255,255,255,0.06); padding: 8px; border-radius: 5px; font-size: 11px; margin-bottom: 6px; word-break: break-all; line-height: 1.4 !important; }

        /* Main Section Layout */
        .cv-main { 
            padding: 35px; 
            background: var(--main-bg); 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
            gap: 14px;
        }

        .cv-header-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); margin-bottom: 5px; }
        .cv-header-card h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1.3 !important; }
        .cv-header-card h2 { font-size: 13px; font-weight: 700; color: var(--primary); margin-top: 4px; text-transform: uppercase; line-height: 1.4 !important; }

        .cv-section { margin-bottom: 0px; }
        .cv-sec-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; line-height: 1.4 !important; }
        .cv-sec-title::after { content: ''; flex: 1; height: 2px; background: var(--border-color); }

        .cv-card { background: var(--card-bg); padding: 12px 15px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; position: relative; }
        .cv-card-title { font-weight: 700; font-size: 13px; line-height: 1.4 !important; }
        .cv-card-badge { font-size: 10px; font-weight: 700; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 10px; float: right; }
        .cv-card-sub { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 5px; line-height: 1.4 !important; }
        .cv-card-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5 !important; white-space: pre-line; }

        .timeline-card { border-left: 2px solid var(--primary); padding-left: 15px; border-radius: 0; border-top: none; border-right: none; border-bottom: none; background: transparent; }

        /* Declaration Footer */
        .cv-declaration { border-top: 2px solid var(--border-color); padding-top: 12px; margin-top: 10px; }
        .signature-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; font-size: 11px; }
        .sig-line { border-top: 1px solid var(--text-main); width: 180px; text-align: center; padding-top: 4px; font-weight: 700; }

        /* Bottom Content Showcase */
        .bottom-showcase {
            width: 794px;
            margin-top: 0px;
            padding-top: 20px;
            border-top: 1px dashed #1f2937;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .showcase-header { text-align: center; }
        .showcase-header h3 { font-size: 16px; color: #38bdf8; margin-bottom: 4px; }
        .showcase-header p { font-size: 12px; color: #64748b; }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .gallery-card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; text-align: center; }
        .gallery-card i { font-size: 24px; color: #38bdf8; margin-bottom: 8px; }
        .gallery-card h4 { font-size: 12px; color: #f3f4f6; margin-bottom: 4px; }
        .gallery-card p { font-size: 10px; color: #9ca3af; }

        .tips-banner { background: linear-gradient(135deg, rgba(2,132,199,0.1), rgba(139,92,246,0.1)); border: 1px solid rgba(56,189,248,0.2); border-radius: 10px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .tips-banner i { font-size: 28px; color: #38bdf8; }
        .tips-banner-text h5 { font-size: 13px; color: #ffffff; margin-bottom: 2px; }
        .tips-banner-text p { font-size: 11px; color: #9ca3af; }

        .footer-credit { text-align: center; font-size: 11px; color: #475569; padding: 10px 0 20px 0; }

        /* TEMPLATES */
        .tpl-nina { grid-template-columns: 250px 1fr; --sidebar-bg: #1f2937; --photo-radius: 50%; }
        .tpl-radhika { grid-template-columns: 240px 1fr; --sidebar-bg: #fdf6f0; --sidebar-text: #2d3748; --main-bg: #ffffff; --card-bg: #fffbf9; --border-color: #f3e8e2; }
        .tpl-vikram { grid-template-columns: 260px 1fr; --sidebar-bg: #334155; --photo-radius: 50%; }
        .tpl-jonathan { grid-template-columns: 240px 1fr; --sidebar-bg: #e5e5e5; --sidebar-text: #171717; --arch-radius: 120px 120px 0 0; }
        .tpl-arrow { grid-template-columns: 250px 1fr; --sidebar-bg: #1e293b; --sidebar-clip: polygon(0 0, 100% 0, 100% 88%, 50% 95%, 0 88%); }
        .tpl-dark { grid-template-columns: 250px 1fr; --sidebar-bg: #090d16; --main-bg: #0f172a; --card-bg: #1e2937; --text-main: #f8fafc; --text-muted: #9ca3af; --border-color: #374151; }
        .tpl-minimal { grid-template-columns: 1fr; padding: 20px; }
        .tpl-minimal .cv-sidebar { display: flex; gap: 20px; background: transparent; color: var(--text-main); padding: 0 0 20px 0; border-bottom: 2px solid var(--border-color); }
        .tpl-modern-split { grid-template-columns: 1fr 1fr; }
        .tpl-executive { font-family: 'Georgia', serif; grid-template-columns: 270px 1fr; --sidebar-bg: #0c1524; }
        .tpl-right-sidebar { grid-template-columns: 1fr 250px; }
        .tpl-right-sidebar .cv-sidebar { grid-column: 2; grid-row: 1; }
        .tpl-right-sidebar .cv-main { grid-column: 1; grid-row: 1; }
        .tpl-compact { grid-template-columns: 220px 1fr; }
        .tpl-compact .cv-main { padding: 20px; }
        .tpl-bold-header { grid-template-columns: 1fr; }
        .tpl-bold-header .cv-header-card { background: var(--primary); color: white; margin: -35px -35px 20px -35px; padding: 35px; border-radius: 0; }
        .tpl-bold-header .cv-header-card h2 { color: #f8fafc; }
        .tpl-creative-grid { grid-template-columns: 280px 1fr; --sidebar-bg: #18181b; }
        .tpl-border-frame { grid-template-columns: 240px 1fr; border: 12px solid var(--primary); }
        .tpl-gradient-glow { grid-template-columns: 250px 1fr; }
        .tpl-gradient-glow .cv-header-card { background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; }
        .tpl-gradient-glow .cv-header-card h2 { color: #e0e7ff; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #1f2937; border: 1px solid #374151; padding: 25px; border-radius: 12px; width: 440px; color: white; max-height: 85vh; overflow-y: auto; }
        .modal-card h3 { color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .modal-card p { font-size: 12px; color: #9ca3af; margin-bottom: 15px; }
        .modal-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; border-radius: 6px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
        .modal-btn-close { background: #374151; color: #ffffff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 6px; }

        .is-hidden { display: none !important; }

        /* Auto-Adjust Mobile View */
        @media (max-width: 1024px) {
            body { height: auto; overflow-x: hidden; overflow-y: auto; }
            .app-container { flex-direction: column; height: auto; }
            .dashboard { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #1f2937; }
            .preview-area { width: 100%; padding: 15px 10px; overflow-x: hidden; min-height: auto; }
            
            .cv-paper {
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                height: auto !important;
                transform: none !important;
                margin-bottom: 20px !important;
                grid-template-columns: 1fr !important;
            }

            .bottom-showcase {
                width: 100% !important;
                transform: none !important;
                margin-top: 10px !important;
            }
        }

        @media (max-width: 768px) {
            .dashboard-body { max-height: 400px; }
            .modal-card { width: 92% !important; margin: 15px; }
            .gallery-grid { grid-template-columns: 1fr; }
            .cv-main { padding: 20px 15px; }
            .cv-sidebar { padding: 20px 15px; border-radius: 0; }
        }

        @media (max-width: 480px) {
            .action-bar { flex-direction: row; gap: 8px; }
            .dashboard-header h2 { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Controls Dashboard -->
        <div class="dashboard">
            <div class="dashboard-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Pro CV Studio</h2>
                <button class="btn-admin-login" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i> Owner Login</button>
            </div>

            <div class="dashboard-body">
                <button class="btn-ai" onclick="runAiEnhancer()"><i class="fa-solid fa-brain"></i> AI Polish & Auto-Fix Content</button>

                <!-- Template Selector -->
                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> Choose CV Layout Template (15 Styles)</label>
                    <select class="form-control" id="tplSelect" onchange="changeTemplateLayout(this.value)">
                        <option value="tpl-nina">1. Nina Lane (Yellow/Charcoal Accent)</option>

                        <option value="tpl-vikram">3. Vikram Malhotra (Slate Grey Banner)</option>
                        <option value="tpl-jonathan">4. Jonathan Patterson (Arch Top Frame)</option>
                        <option value="tpl-arrow">5. Arrow Accent Corporate</option>
                        <option value="tpl-dark">6. Cyber Dark Mode</option>
                        <option value="tpl-minimal">7. Minimalist Clean White</option>
                        <option value="tpl-modern-split">8. Modern Split 50/50 Dual Tone</option>
                        <option value="tpl-executive">9. Executive Classic Serif</option>
                        <option value="tpl-right-sidebar">10. Elegant Right Sidebar</option>
                        <option value="tpl-compact">11. Compact Technical One-Pager</option>
                        <option value="tpl-bold-header">12. Bold Header Banner</option>
                        <option value="tpl-creative-grid">13. Creative Two-Column Grid</option>
                        <option value="tpl-border-frame">14. Framed Border Elegance</option>
                        <option value="tpl-gradient-glow">15. Vibrant Gradient Glow</option>
                    </select>
                </div>

                <!-- Custom Color Picker -->
                <div class="form-group">
                    <label><i class="fa-solid fa-palette"></i> Customize Accent Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="colorPicker" value="#0284c7" onchange="applyCustomColor(this.value)" style="border:none; width:35px; height:35px; cursor:pointer; background:none;">
                        <div class="color-preset" style="background:#0284c7;" onclick="applyCustomColor('#0284c7')"></div>
                        <div class="color-preset" style="background:#10b981;" onclick="applyCustomColor('#10b981')"></div>
                        <div class="color-preset" style="background:#8b5cf6;" onclick="applyCustomColor('#8b5cf6')"></div>
                        <div class="color-preset" style="background:#f59e0b;" onclick="applyCustomCo
